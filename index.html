span></button><button class="nav" id="untriednav" title="Untasted beers"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/></svg></span><span class="label">Untasted beers</span></button><button class="nav " id="ranknav" title="Tier list"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20V10h4v10M10 20V4h4v16M16 20v-7h4v7"/></svg></span><span class="label">Tier list</span></button><button class="nav" id="requestNav" title="Request a beer"><span class="icon">+</span><span class="label">Request a beer</span></button><button class="nav bottom" id="printCards" title="Printable beer cards"><span class="icon">▤</span><span class="label">Printable beer cards</span></button></aside><main><h1 id="pageTitle">All beers</h1><div class="filters"><select id="rank" aria-label="Tier"><option value="">All tiers</option><option value="none">Unranked</option><option>S</option><option>A</option><option>B</option><option>C</option><option>D</option><option>F</option></select></div><p id="count"></p><div id="board" hidden></div><div class="table"><table><thead><tr><th aria-sort="none"><button class="name sort" data-sort="name">Beer</button></th><th aria-sort="none"><button class="name sort" data-sort="brand">Brand</button></th><th aria-sort="none"><button class="name sort" data-sort="tried">Tasted</button></th><th><button class="name sort" data-sort="tier">Tier</button></th></tr></thead><tbody id="rows"></tbody></table></div></main></div><dialog id="requestDialog"><form id="requestForm"><h2>Request a beer</h2><label>Beer name<input name="beer" required maxlength="150"></label><label>Brand<input name="brand" maxlength="150"></label><label>Product link (optional)<input name="link" type="url"></label><div class="actions"><button type="submit">Prepare request</button><button type="button" id="requestClose">Close</button></div></form></dialog><dialog id="printSettings"><h2>Printable beer cards</h2><label>C const $=x=>document.getElementById(x), key='ausbeerlist-public-rankings-v1', tiers=['S','A','B','C','D','F'];let beers,editing,descending=false,sortKey="name",view="all";
let stored={};try{stored=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{};beers=seed.map(b=>{let r=Object.prototype.hasOwnProperty.call(stored,b.id)?stored[b.id]||{}:{};return {...b,tried:!!r.tried||tiers.includes(r.tier),tier:tiers.includes(r.tier)?r.tier:'',tierOrder:Number.isFinite(r.tierOrder)?r.tierOrder:null}});function save(){try{localStorage.setItem(key,JSON.stringify(Object.fromEntries(beers.map(b=>[b.id,{tried:b.tried,tier:b.tier,tierOrder:b.tierOrder}]))))}catch(e){alert('Rankings could not be saved in this browser.')}render()}function photo(b){let blank=()=>{let e=el('span','No photo');e.className='beerphoto photoblank';return e};let url=localPhoto(b.image);if(!url)return blank();let img=el('img');img.className='beerphoto';img.alt=b.name;img.loading='lazy';img.draggable=false;img.referrerPolicy='no-referrer';img.onerror=()=>img.replaceWith(blank());img.src=url;if(Array.isArray(b.crop)&&b.crop.length===4&&b.crop[2]>0&&b.crop[3]>0){let box=el('span');box.className='beerphoto cropbox';box.style.position='relative';box.style.overflow='hidden';img.className='croppedimage';img.onload=()=>{let [x,y,w,h]=b.crop,ratio=img.naturalWidth/img.naturalHeight, bw=box.clientWidth,bh=box.clientHeight,scale=Math.min(bw/(ratio*w),bh/h);Object.assign(img.style,{position:'absolute',width:ratio*scale+'px',height:scale+'px',maxWidth:'none',left:(bw-ratio*scale*w)/2-x*ratio*scale+'px',top:(bh-scale*h)/2-y*scale+'px',clipPath:`inset(${y*100}% ${(1-x-w)*100}% ${(1-y-h)*100}% ${x*100}%)`})};box.append(img);return box}return img}function el(t,x){let e=document.createElement(t);if(x!==undefined)e.textContent=x;return e}function cell(tr,x){let td=el('td');if(typeof x==='string')td.textContent=x;else td.append(x);tr.append(td);return td}function localPhoto(u){return /^images\/[a-z0-9_-]+\.(png|jpg|jpeg|webp|gif)$/i.test(u||'')?u:''}function safe(u){try{let p=new URL(u);return ['https:','http:'].includes(p.protocol)?p.href:''}catch{return ''}}

function compareBeers(a,b){let result=0;switch(sortKey){case 'tried':result=Number(b.tried)-Number(a.tried);break;case 'tier':result=(a[sortKey]?tiers.indexOf(a[sortKey]):tiers.length)-(b[sortKey]?tiers.indexOf(b[sortKey]):tiers.length);break;default:result=a[sortKey].localeCompare(b[sortKey]);}return (descending?-1:1)*result||a.name.localeCompare(b.name)}
function updateSort(){for(const btn of document.querySelectorAll('.sort')){const k=btn.dataset.sort,active=k===sortKey;btn.textContent=({name:'Beer',brand:'Brand',tried:'Tasted',tier:'Tier'})[k]+(active?(descending?' ↓':' ↑'):' ↕');btn.parentElement.setAttribute('aria-sort',active?(descending?'descending':'ascending'):'none')}}
function ordered(t){return beers.filter(b=>b.tier===t).sort((a,b)=>(a.tierOrder??Infinity)-(b.tierOrder??Infinity)||a.name.localeCompare(b.name))}

function renderBoard(){let q=$('search').value.toLowerCase();$('count').textContent=beers.filter(b=>b.tier).length+' ranked';let board=$('board');board.replaceChildren();const clear=()=>board.querySelectorAll('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after'));for(const t of [...tiers,'']){let row=el('section');row.className='tierrow';let label=el('strong',t||'Unranked');label.className=t||'unranked';let area=el('div');area.className='tierarea';area.ondragover=e=>{e.preventDefault();clear()};area.ondrop=e=>{e.preventDefault();clear();let b=beers.find(b=>b.id===e.dataTransfer.getData('text/plain'));if(b){moveBeer(b,t);save()}};for(const b of ordered(t).filter(b=>b.name.toLowerCase().includes(q))){let card=el('div');card.className='tiercard';card.draggable=true;card.ondragstart=e=>{e.dataTransfer.setData('text/plain',b.id);e.dataTransfer.effectAllowed='move'};card.ondragend=clear;card.ondragover=e=>{e.preventDefault();e.stopPropagation();clear();let r=card.getBoundingClientRect();card.classList.add(e.clientX<r.left+r.width/2?'drop-before':'drop-after')};card.ondrop=e=>{e.preventDefault();e.stopPropagation();clear();let moving=beers.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(moving&&moving!==b){let r=card.getBoundingClientRect();moveBeer(moving,t,b,e.clientX>=r.left+r.width/2);save()}};card.append(photo(b),el('span',b.name));card.tabIndex=0;card.title='Drag to reorder';area.append(card)}row.append(label,area);board.append(row)}}
for(const btn of document.querySelectorAll('.sort'))btn.onclick=()=>{const k=btn.dataset.sort;descending=k===sortKey?!descending:false;sortKey=k;render()};for(const s of ['search','rank'])$(s).addEventListener(s==='search'?'input':'change',render);$('requestNav').onclick=()=>$('requestDialog').showModal();$('requestClose').onclick=()=>$('requestDialog').close();$('requestForm').onsubmit=e=>{e.preventDefault();let f=e.target.elements;let body='Beer: '+f.beer.value.trim()+'\nBrand: '+f.brand.value.trim()+'\nLink: '+f.link.value.trim();location.href='mailto:'+encodeURIComponent(window.beerRequestEmail||'')+'?subject='+encodeURIComponent('Beer addition request')+'&body='+encodeURIComponent(body);};$('toggle').onclick=()=>{let c=document.body.classList.toggle('collapsed');$('toggle').setAttribute('aria-expanded',String(!c))};for(const id of ['all','triednav','untriednav','ranknav'])$(id).onclick=()=>{view=id;for(const n of ['all','triednav','untriednav','ranknav']){$(n).classList.toggle('active',n===id);$(n).setAttribute('aria-pressed',String(n===id))}$('pageTitle').textContent={all:'All beers',triednav:'Tasted beers',untriednav:'Untasted beers',ranknav:'Tier list'}[id];$('rank').value='';render()};render();

function printPlan(){let w=Number($('cardW').value),h=Number($('cardH').value),list=beers.filter(b=>!$('onlyPhotos').checked||b.image).sort((a,b)=>a.name.localeCompare(b.name));let valid=Number.isFinite(w)&&Number.isFinite(h)&&w>=20&&w<=190&&h>=25&&h<=277;let cols=valid?Math.floor(190/w):0,lines=valid?Math.floor(277/h):0;return {w,h,list,cols,lines,valid:valid&&list.length>0}}

$('printCards').onclick=()=>{$('printSettings').showModal();printInfo()};$('cancelPrint').onclick=()=>$('printSettings').close();for(let id of ['cardW','cardH','onlyPhotos'])$(id).oninput=printInfo;
async function croppedPrintImage(b){

 const W=im.naturalWidth,H=im.naturalHeight;let c=b.crop;
 if(!Array.isArray(c)||c.length!==4||!c.every(Number.isFinite)||c[2]<=0||c[3]<=0)c=[0,0,1,1];
 const clamp=(v,max)=>Math.max(0,Math.min(max,v));let x=clamp(Math.floor(c[0]*W),W-1),y=clamp(Math.floor(c[1]*H),H-1),r=clamp(Math.ceil((c[0]+c[2])*W),W),d=clamp(Math.ceil((c[1]+c[3])*H),H);if(r<=x||d<=y){x=0;y=0;r=W;d=H;}
 const canvas=document.createElement('canvas'),scale=Math.min(1,1600/Math.max(r-x,d-y));canvas.width=Math.max(1,Math.round((r-x)*scale));canvas.height=Math.max(1,Math.round((d-y)*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,x,y,r-x,d-y,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/png');
}
$('doPrint').onclick=async()=>{const p=printPlan();if(!p.valid)return;const root=$('printSheets');root.replaceChildren();$('doPrint').disabled=true;$('cancelPrint').disabled=true;let failures=[],done=0;try{const per=p.cols*p.lines;let page;for(const b of p.list){if(done%per===0){page=el('div');page.className='printPage';page.style.gridTemplateColumns=`repeat(${p.cols},${p.w}mm)`;page.style.gridAutoRows=p.h+'mm';root.append(page)}const card=el('div'),area=el('div'),name=el('div');name.append(el('span',b.name));card.className='printCard';card.style.setProperty('--name-height',Math.min(12,p.h*.30)+'mm');card.style.setProperty('--name-font',Math.min(9,Math.max(5,p.w*.225),Math.max(5,p.h*.18))+'pt');area.className='printImage';name.className='printName';card.append(area,name);page.append(card);try{const img=el('img');img.alt=b.name;img.src=await croppedPrintImage(b);await img.decode();area.append(img)}catch(e){failures.push(b.name+': '+e.message);const blank=el('span','No photo');blank.className='printMissing';area.append(blank)}done++;$('printInfo').textContent=`Preparing cards: ${done} / ${p.list.length}`;}if(failures.length&&!confirm(`${failures.length} photos could not be loaded:\n${failures.slice(0,12).join('\n')}\nPrint anyway?`)){root.replaceChildren();return}const measure=document.createElement('style');measure.textContent='#printSheets{display:block!important;position:absolute;left:-20000px;top:0}.printPage{display:grid;width:190mm}.printCard{display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;min-height:0;min-width:0}.printImage{overflow:hidden;min-height:0}.printImage img{width:100%;height:100%;object-fit:contain}.printName{flex-shrink:0}';document.head.append(measure);for(const n of root.querySelectorAll('.printName')){const span=n.firstElementChild;let size=parseFloat(getComputedStyle(n).fontSize);while(span.scrollHeight>n.clientHeight-4&&size>4){size-=.5;n.style.fontSize=size+'px'}}measure.remove();$('printSettings').close();window.print()}finally{$('cancelPrint').disabled=false;printInfo()}};
